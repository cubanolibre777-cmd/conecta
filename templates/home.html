<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conecta</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <style>
    body { display: block; }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px;
    }
    .top-bar a { color: var(--text-dim); display: flex; }
    .top-bar a:hover { color: var(--accent-soft); }
    .top-bar .brand { font-size: 15px; font-weight: 600; color: var(--text-dim); }

    .wrap { max-width: 420px; margin: 0 auto; padding: 8px 20px 20px; }

    .flash { padding: 11px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 16px; }
    .flash.error { background: rgba(255,107,129,0.12); color: var(--error); border: 1px solid rgba(255,107,129,0.3); }
    .flash.success { background: rgba(53,224,196,0.12); color: var(--pulse); border: 1px solid rgba(53,224,196,0.3); }

    .token-card {
      background: var(--bg-panel); border: 1px solid #1D2138; border-radius: 20px;
      padding: 32px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .coin-icon { position: relative; width: 64px; height: 46px; margin-bottom: 4px; }
    .coin-icon .c1, .coin-icon .c2 {
      position: absolute; width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 17px; box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    }
    .coin-icon .c1 { left: 0; top: 4px; background: var(--pulse); color: #05060C; }
    .coin-icon .c2 { right: 0; top: 0; background: var(--accent); color: white; }

    .token-label { font-size: 13.5px; color: var(--text-dim); }
    .token-amount { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }

    .token-actions { display: flex; gap: 12px; width: 100%; margin-top: 8px; }
    .token-actions button {
      flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 600;
      font-size: 14px; font-family: inherit; cursor: pointer; display: flex;
      align-items: center; justify-content: center; gap: 6px;
    }
    .btn-deposit { background: var(--accent); color: white; }
    .btn-deposit:hover { background: #7C6CF7; }
    .btn-withdraw { background: transparent; border: 1px solid #2A2E4A !important; color: var(--text-main); }
    .btn-withdraw:hover { border-color: var(--accent-soft) !important; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="{{ url_for('menu_page') }}" title="Configuración">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </a>
    <span class="brand">Conecta</span>
    <a href="{{ url_for('menu_page') }}" title="Notificaciones">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    </a>
  </div>

  <div class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="token-card">
      <div class="coin-icon">
        <div class="c1">C</div>
        <div class="c2">C</div>
      </div>
      <div class="token-label">Tokens depositados</div>
      <div class="token-amount">{{ user.tokens }}</div>

      <div class="token-actions">
        <button class="btn-deposit" onclick="window.location.href='{{ url_for('tokens_deposit') }}'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
          Depositar
        </button>
        <button class="btn-withdraw" onclick="window.location.href='{{ url_for('tokens_withdraw') }}'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          Extraer
        </button>
      </div>
    </div>
  </div>

  {% set active_tab = 'inicio' %}
  {% include "_bottom_nav.html" %}
</body>
</html>
