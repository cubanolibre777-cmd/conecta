<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/static/service-worker.js");
  }
</script>

<style>
  .top-toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--bg-panel); border: 1px solid var(--accent); border-radius: 14px;
    padding: 14px 18px; display: none; align-items: center; gap: 12px; z-index: 999;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); max-width: 340px; width: calc(100% - 40px);
    text-decoration: none; color: var(--text-main);
  }
  .top-toast img, .top-toast .avatar-fallback {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  }
  .top-toast .avatar-fallback {
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: white;
  }
  .top-toast .info { font-size: 13.5px; min-width: 0; }
  .top-toast .info strong { display: block; font-size: 14px; }
  .top-toast .info .preview {
    color: var(--text-dim); font-size: 12.5px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; display: block; max-width: 190px;
  }
  .top-toast .btns { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
  .top-toast button {
    border: none; border-radius: 8px; padding: 7px 12px; font-size: 12.5px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .top-toast .accept { background: var(--pulse); color: #05060C; }
  .top-toast .reject { background: var(--error); color: white; }
</style>

<div class="top-toast" id="incomingCallBanner">
  <img id="incomingCallPhoto" style="display:none;" alt="">
  <div class="avatar-fallback" id="incomingCallFallback"></div>
  <div class="info">
    <strong id="incomingCallName"></strong>
    {{ t('call_incoming_label') }}
  </div>
  <div class="btns">
    <button class="accept" id="incomingCallAccept">{{ t('friends_accept') }}</button>
    <button class="reject" id="incomingCallReject">{{ t('friends_reject') }}</button>
  </div>
</div>

<a href="#" class="top-toast" id="messageToast">
  <img id="messageToastPhoto" style="display:none;" alt="">
  <div class="avatar-fallback" id="messageToastFallback"></div>
  <div class="info">
    <strong id="messageToastName"></strong>
    <span class="preview" id="messageToastPreview"></span>
  </div>
</a>

<script>
  (function () {
    if (window.__conectaGlobalSocket) return;
    const socket = io();
    window.__conectaGlobalSocket = socket;

    const I18N_SOMEONE = {{ t('generic_someone')|tojson }};
    const I18N_PHOTO_LABEL = {{ t('inbox_photo_label')|tojson }};

    // --- Llamada entrante ---
    const banner = document.getElementById("incomingCallBanner");
    const photoImg = document.getElementById("incomingCallPhoto");
    const fallback = document.getElementById("incomingCallFallback");
    const nameEl = document.getElementById("incomingCallName");
    const acceptBtn = document.getElementById("incomingCallAccept");
    const rejectBtn = document.getElementById("incomingCallReject");
    let currentCallerId = null;

    socket.on("incoming_call", (data) => {
      currentCallerId = data.from_id;
      nameEl.textContent = data.from_name || I18N_SOMEONE;

      if (data.from_photo) {
        photoImg.src = data.from_photo;
        photoImg.style.display = "block";
        fallback.style.display = "none";
      } else {
        fallback.textContent = (data.from_name || "?")[0].toUpperCase();
        fallback.style.display = "flex";
        photoImg.style.display = "none";
      }
      banner.style.display = "flex";
      bumpChatBadge();
    });

    acceptBtn.addEventListener("click", () => {
      if (!currentCallerId) return;
      banner.style.display = "none";
      window.location.href = "/call/" + currentCallerId + "?incoming=1";
    });

    rejectBtn.addEventListener("click", () => {
      if (!currentCallerId) return;
      socket.emit("call_response", { target_id: currentCallerId, accepted: false });
      banner.style.display = "none";
      currentCallerId = null;
    });

    // Si quien te llama cuelga antes de que respondas, el aviso se cierra solo.
    socket.on("call_end", (data) => {
      if (currentCallerId && data.from_id == currentCallerId) {
        banner.style.display = "none";
        currentCallerId = null;
      }
    });

    // --- Mensaje nuevo ---
    const msgToast = document.getElementById("messageToast");
    const msgPhoto = document.getElementById("messageToastPhoto");
    const msgFallback = document.getElementById("messageToastFallback");
    const msgName = document.getElementById("messageToastName");
    const msgPreview = document.getElementById("messageToastPreview");
    let msgToastTimer = null;

    socket.on("new_message", (data) => {
      // Si ya estás viendo esa conversación, no hace falta molestarte con el aviso.
      if (window.location.pathname === "/messages/" + data.from_id) {
        return;
      }

      msgName.textContent = data.from_name || I18N_SOMEONE;
      msgPreview.textContent = data.content || (data.image_url ? I18N_PHOTO_LABEL : "");
      msgToast.href = "/messages/" + data.from_id;

      if (data.from_photo) {
        msgPhoto.src = data.from_photo;
        msgPhoto.style.display = "block";
        msgFallback.style.display = "none";
      } else {
        msgFallback.textContent = (data.from_name || "?")[0].toUpperCase();
        msgFallback.style.display = "flex";
        msgPhoto.style.display = "none";
      }

      msgToast.style.display = "flex";
      clearTimeout(msgToastTimer);
      msgToastTimer = setTimeout(() => { msgToast.style.display = "none"; }, 5000);

      bumpChatBadge();
    });

    function bumpChatBadge() {
      const badge = document.getElementById("navChatBadge");
      if (!badge) return;
      const current = parseInt(badge.textContent) || 0;
      const next = current + 1;
      badge.textContent = next > 9 ? "9+" : next;
      badge.style.display = "flex";
    }

    // --- Cambios de amistad (solicitud, aceptar, cancelar, dejar de ser amigos) ---
    socket.on("friend_update", (data) => {
      // Si tienes el perfil de esa persona abierto ahora mismo, recarga para
      // reflejar el nuevo estado (icono, contadores) sin que tengas que hacerlo tú.
      if (window.location.pathname === "/profile/" + data.from_id) {
        window.location.reload();
        return;
      }
      // Aunque no estés en su perfil, si generó una notificación real,
      // avisa igual con el contador de la campana (junto a Mensajes).
      if (data.notify) {
        const bell = document.querySelector('#notifBellLink .special-count');
        if (bell) {
          const current = parseInt(bell.textContent) || 0;
          const next = current + 1;
          bell.textContent = next > 9 ? "9+" : next;
          bell.style.display = "flex";
        }
      }
    });
  })();
</script>
