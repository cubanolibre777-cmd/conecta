<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú · Conecta</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <style>
    body { display: block; }
    .wrap { max-width: 420px; margin: 0 auto; padding: 28px 20px 20px; }

    .menu-profile {
      display: flex; align-items: center; gap: 14px; padding: 16px;
      border: 1px solid #1D2138; border-radius: 14px; text-decoration: none;
      color: var(--text-main); margin-bottom: 20px;
    }
    .menu-avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
    .menu-avatar-fallback {
      width: 52px; height: 52px; border-radius: 50%; background: var(--accent);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px;
    }
    .menu-profile-name { font-weight: 700; font-size: 15px; }
    .menu-profile-sub { font-size: 12.5px; color: var(--text-dim); }

    .menu-list { display: flex; flex-direction: column; gap: 8px; }
    .menu-item {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      border: 1px solid #1D2138; border-radius: 12px; text-decoration: none;
      color: var(--text-main); font-size: 14.5px; font-weight: 600;
      background: none; width: 100%; text-align: left; font-family: inherit; cursor: pointer;
    }
    .menu-item:hover { border-color: var(--accent-soft); background: var(--bg-panel); }
    .menu-item svg { width: 20px; height: 20px; color: var(--text-dim); flex-shrink: 0; }
    .menu-item.danger { color: var(--error); }
    .menu-item.danger svg { color: var(--error); }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="{{ url_for('profile') }}" class="menu-profile">
      {% if user.display_photo %}
        <img class="menu-avatar" src="{{ user.display_photo }}" alt="">
      {% else %}
        <div class="menu-avatar-fallback">{{ user.name[:1] if user.name else user.email[:1] }}</div>
      {% endif %}
      <div>
        <div class="menu-profile-name">{{ user.name or user.email }}</div>
        <div class="menu-profile-sub">Ver mi perfil</div>
      </div>
    </a>

    <div class="menu-list">
      <a href="{{ url_for('profile_edit') }}" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Editar perfil
      </a>
      <a href="#" class="menu-item" onclick="return false;" style="opacity:0.5; cursor:default;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Configuración (próximamente)
      </a>
      <a href="#" class="menu-item" onclick="return false;" style="opacity:0.5; cursor:default;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        Notificaciones (próximamente)
      </a>
      <a href="{{ url_for('logout') }}" class="menu-item danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Cerrar sesión
      </a>
    </div>
  </div>

  {% set active_tab = 'menu' %}
  {% include "_bottom_nav.html" %}
</body>
</html>
