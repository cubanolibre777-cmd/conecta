<style>
  .bottom-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    display: flex; justify-content: space-around; align-items: center;
    background: var(--bg-panel); border-top: 1px solid #1D2138;
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
    z-index: 10;
  }
  .bottom-bar a {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--text-dim); text-decoration: none; font-size: 11px; font-weight: 600;
    flex: 1; padding: 4px 0; position: relative;
  }
  .bottom-bar a:hover, .bottom-bar a.active { color: var(--accent-soft); }
  .bottom-bar svg { width: 22px; height: 22px; }
  .bottom-bar .icon-wrap { position: relative; display: inline-flex; }
  .nav-badge {
    position: absolute; top: -5px; right: -8px; min-width: 16px; height: 16px;
    border-radius: 999px; background: var(--error); color: white; font-size: 10px;
    font-weight: 700; display: flex; align-items: center; justify-content: center;
    padding: 0 4px; border: 2px solid var(--bg-panel);
  }
  body { padding-bottom: 78px; }
</style>

<div class="bottom-bar">
  <a href="{{ url_for('index') }}" class="{{ 'active' if active_tab == 'inicio' else '' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    Inicio
  </a>
  <a href="{{ url_for('users_list') }}" class="{{ 'active' if active_tab == 'usuarios' else '' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Usuarios
  </a>
  <a href="{{ url_for('messages_inbox') }}" class="{{ 'active' if active_tab == 'chat' else '' }}">
    <span class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.3 0-2.5-.3-3.6-.8L3 21l1.8-5.4A8.5 8.5 0 1 1 21 11.5z"/></svg>
      <span class="nav-badge" id="navChatBadge" style="{{ '' if unread_messages_count and unread_messages_count > 0 else 'display:none;' }}">{{ '9+' if unread_messages_count and unread_messages_count > 9 else (unread_messages_count or '') }}</span>
    </span>
    Chat
  </a>
  <a href="{{ url_for('menu_page') }}" class="{{ 'active' if active_tab == 'menu' else '' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    Menú
  </a>
</div>
